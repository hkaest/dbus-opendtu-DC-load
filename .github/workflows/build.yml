name: Build

on:
  workflow_run:
    workflows: ["Pylint"]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Determine build number
        id: buildnum
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            next=${{ github.event.workflow_run.run_number }}
          elif [ -f build_number.txt ]; then
            current=$(tr -d '\r\n' < build_number.txt)
            next=$((current + 1))
          else
            next=1
          fi
          echo "value=$next" > "$GITHUB_OUTPUT"

      - name: Write build number file
        run: |
          echo "${{ steps.buildnum.outputs.value }}" > build_number.txt

      - name: Commit updated build number
        env:
          BUILD_NUMBER: ${{ steps.buildnum.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_number.txt
          if git diff --cached --quiet; then
            echo "No build number change to commit."
          else
            git commit -m "chore: set build number to $BUILD_NUMBER"
            git push
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            build_number.txt
            version.py
